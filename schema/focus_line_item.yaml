id: https://example.org/focus_line_item_schema
name: focus_line_item
description: A subset of the FinOps FOCUS 1.3 specification covering the columns required for federated billing. CSPs MUST populate all required fields. Recommended fields SHOULD be populated where the CSP's billing system supports them.
classes:
  FocusLineItem:
    description: 'A subset of the FinOps FOCUS 1.3 specification covering the columns required for federated billing. CSPs MUST populate all required fields.  Recommended fields SHOULD be populated where the CSP''s billing system supports them.  Reference: https://focus.finops.org/focus-specification/1-3/'
    abstract: true
    attributes:
      AllocatedMethodDetails:
        title: Allocated Method Details
        description: A set of properties describing how resources are allocated in data generator-defined split cost allocation.
        required: false
        range: string
      AllocatedMethodId:
        title: Allocated Method ID
        description: A unique identifier defining the method of data generator-calculated split cost allocation.
        required: false
        range: string
      AllocatedResourceId:
        title: Allocated Resource ID
        description: The identifier of the object to which cost is allocated in data generator-calculated split cost allocation.
        required: false
        range: string
      AllocatedResourceName:
        title: Allocated Resource Name
        description: The display name of the object to which cost is allocated in data generator-calculated split cost allocation.
        required: false
        range: string
      AllocatedTags:
        title: Allocated Tags
        description: A set of tags assigned to tag sources that are applicable to allocated charges in data generator-calculated split cost allocation.
        required: false
        range: string
      AvailabilityZone:
        title: Availability Zone
        description: A host-provider-assigned identifier for a physically separated and isolated area within a Region that provides high availability and fault tolerance.
        required: false
        range: string
      BilledCost:
        title: Billed Cost
        description: A charge serving as the basis for invoicing, inclusive of all reduced rates and discounts while excluding the amortization of upfront charges (one-time or recurring).
        required: true
        range: decimal
      BillingAccountId:
        title: Billing Account ID
        description: The identifier assigned to a billing account by the invoice issuer.
        required: true
        range: string
      BillingAccountName:
        title: Billing Account Name
        description: The display name assigned to a billing account .
        required: false
        range: string
      BillingAccountType:
        title: Billing Account Type
        description: An invoice-issuer-assigned name to identify the type of billing account .
        required: true
        range: string
      BillingCurrency:
        title: Billing Currency
        description: Represents the currency that a charge was billed in.
        required: true
        range: string
      BillingPeriodEnd:
        title: Billing Period End
        description: The exclusive end bound of a billing period .
        required: true
        range: datetime
      BillingPeriodStart:
        title: Billing Period Start
        description: The inclusive start bound of a billing period .
        required: true
        range: datetime
      CapacityReservationId:
        title: Capacity Reservation ID
        description: The identifier assigned to a capacity reservation by the service provider.
        required: false
        range: string
      CapacityReservationStatus:
        title: Capacity Reservation Status
        description: Indicates whether the charge represents either the consumption of a capacity reservation or when a capacity reservation is unused.
        required: false
        range: CapacityReservationStatusEnum
      ChargeCategory:
        title: Charge Category
        description: Represents the highest-level classification of a charge based on the nature of how it is billed.
        required: true
        range: string
      ChargeClass:
        title: Charge Class
        description: Indicates whether the row represents a correction to a previously invoiced billing period .
        required: false
        range: string
      ChargeDescription:
        title: Charge Description
        description: Self-contained summary of the charge's purpose and price.
        required: false
        range: string
      ChargeFrequency:
        title: Charge Frequency
        description: Indicates how often a charge will occur.
        required: true
        range: string
      ChargePeriodEnd:
        title: Charge Period End
        description: The exclusive end bound of a charge period .
        required: true
        range: datetime
      ChargePeriodStart:
        title: Charge Period Start
        description: The inclusive start bound of a charge period .
        required: true
        range: datetime
      CommitmentDiscountCategory:
        title: Commitment Discount Category
        description: Indicates whether the commitment discount identified in the CommitmentDiscountId column is based on usage quantity or cost (aka "spend").
        required: false
        range: CommitmentDiscountCategoryEnum
      CommitmentDiscountId:
        title: Commitment Discount ID
        description: The identifier assigned to a commitment discount by the service provider.
        required: false
        range: string
      CommitmentDiscountName:
        title: Commitment Discount Name
        description: The display name assigned to a commitment discount .
        required: false
        range: string
      CommitmentDiscountQuantity:
        title: Commitment Discount Quantity
        description: The amount of a commitment discount purchased or accounted for in commitment discount related rows that is denominated in Commitment Discount Units.
        required: false
        range: decimal
      CommitmentDiscountStatus:
        title: Commitment Discount Status
        description: Indicates whether the charge corresponds with the consumption of a commitment discount or the unused portion of the committed amount.
        required: false
        range: CommitmentDiscountStatusEnum
      CommitmentDiscountType:
        title: Commitment Discount Type
        description: A service-provider-assigned identifier for the type of commitment discount applied to the row .
        required: false
        range: string
      CommitmentDiscountUnit:
        title: Commitment Discount Unit
        description: The service-provider-specified measurement unit indicating how a service provider measures the Commitment Discount Quantity of a commitment discount .
        required: false
        range: string
      ConsumedQuantity:
        title: Consumed Quantity
        description: The volume of a metered SKU associated with a resource or service used, based on the Consumed Unit.
        required: false
        range: decimal
      ConsumedUnit:
        title: Consumed Unit
        description: Service-provider-specified measurement unit indicating how a service provider measures usage of a metered SKU associated with a resource or service .
        required: false
        range: string
      ContractApplied:
        title: Contract Applied
        description: A set of properties that associate a charge with one or more contract commitments .
        required: false
        range: string
      ContractedCost:
        title: Contracted Cost
        description: Cost calculated by multiplying contracted unit price and the corresponding Pricing Quantity.
        required: true
        range: decimal
      ContractedUnitPrice:
        title: Contracted Unit Price
        description: The agreed-upon unit price for a single Pricing Unit of the associated SKU, inclusive of negotiated discounts, if present, while excluding negotiated commitment discounts or any other discounts.
        required: false
        range: decimal
      EffectiveCost:
        title: Effective Cost
        description: The amortized cost of the charge after applying all reduced rates, discounts, and the applicable portion of relevant, prepaid purchases (one-time or recurring) that covered this charge .
        required: true
        range: decimal
      HostProviderName:
        title: Host Provider Name
        description: The name of the entity whose resources are used by the Service Provider to make their resources or services available.
        required: true
        range: string
      InvoiceId:
        title: Invoice ID
        description: The invoice-issuer-assigned identifier for an invoice encapsulating charges in the corresponding billing period for a given billing account.
        required: false
        range: string
      InvoiceIssuerName:
        title: Invoice Issuer Name
        description: The name of the entity responsible for invoicing for the resources or services consumed.
        required: true
        range: string
      ListCost:
        title: List Cost
        description: Cost calculated by multiplying List Unit Price and the corresponding Pricing Quantity.
        required: true
        range: decimal
      ListUnitPrice:
        title: List Unit Price
        description: The suggested service-provider-published unit price for a single Pricing Unit of the associated SKU, exclusive of any discounts.
        required: false
        range: decimal
      PricingCategory:
        title: Pricing Category
        description: Describes the pricing model used for a charge at the time of use or purchase.
        required: false
        range: string
      PricingCurrency:
        title: Pricing Currency
        description: The national or virtual currency denomination that a resource or service was priced in.
        required: false
        range: string
      PricingCurrencyContractedUnitPrice:
        title: Pricing Currency Contracted Unit Price
        description: The agreed-upon unit price for a single Pricing Unit of the associated SKU, inclusive of negotiated discounts , if present, while excluding negotiated commitment discounts or any other discounts, and expressed in Pricing Currency.
        required: false
        range: decimal
      PricingCurrencyEffectiveCost:
        title: Pricing Currency Effective Cost
        description: The cost of the charge after applying all reduced rates, discounts, and the applicable portion of relevant, prepaid purchases (one-time or recurring) that covered this charge , as denominated in Pricing Currency.
        required: false
        range: decimal
      PricingCurrencyListUnitPrice:
        title: Pricing Currency List Unit Price
        description: The suggested service-provider-published unit price for a single Pricing Unit of the associated SKU , exclusive of any discounts and expressed in Pricing Currency.
        required: false
        range: decimal
      PricingQuantity:
        title: Pricing Quantity
        description: The volume of a given SKU associated with a resource or service used or purchased, based on the Pricing Unit.
        required: false
        range: decimal
      PricingUnit:
        title: Pricing Unit
        description: Service-provider-specified measurement unit for determining unit prices, indicating how the service provider rates measured usage and purchase quantities after applying pricing rules like block pricing .
        required: false
        range: string
      RegionId:
        title: Region ID
        description: Host-provider-assigned identifier for an isolated geographic area where a resource is provisioned or a service is provided.
        required: false
        range: string
      RegionName:
        title: Region Name
        description: The name of an isolated geographic area where a resource is provisioned or a service is provided.
        required: false
        range: string
      ResourceId:
        title: Resource ID
        description: Identifier assigned to a resource by the service provider.
        required: false
        range: string
      ResourceName:
        title: Resource Name
        description: Display name assigned to a resource .
        required: false
        range: string
      ResourceType:
        title: Resource Type
        description: The kind of resource the charge applies to.
        required: false
        range: string
      ServiceCategory:
        title: Service Category
        description: Highest-level classification of a service based on the core function of the service .
        required: true
        range: ServiceCategoryEnum
      ServiceName:
        title: Service Name
        description: An offering that can be purchased from a service provider (e.g., cloud virtual machine, SaaS database, professional services from a systems integrator).
        required: true
        range: string
      ServiceProviderName:
        title: Service Provider Name
        description: The name of the entity that made the resources or services available for purchase or consumption.
        required: true
        range: string
      ServiceSubcategory:
        title: Service Subcategory
        description: Secondary classification of the Service Category for a service based on its core function.
        required: true
        range: ServiceSubcategoryEnum
      SkuId:
        title: SKU ID
        description: Service-provider-specified unique identifier that represents a specific SKU (e.g., a quantifiable good or service offering).
        required: false
        range: string
      SkuMeter:
        title: SKU Meter
        description: Describes the functionality being metered or measured by a particular SKU in a charge .
        required: false
        range: string
      SkuPriceDetails:
        title: SKU Price Details
        description: A set of properties of a SKU Price ID which are meaningful and common to all instances of that SKU Price ID.
        required: false
        range: string
      SkuPriceId:
        title: SKU Price ID
        description: A service-provider-specified unique identifier that represents a specific SKU Price associated with a resource or service used or purchased.
        required: false
        range: string
      SubAccountId:
        title: Sub Account ID
        description: An ID assigned to a grouping of resources or services , often used to manage access and/or cost.
        required: false
        range: string
      SubAccountName:
        title: Sub Account Name
        description: A name assigned to a grouping of resources or services , often used to manage access and/or cost.
        required: false
        range: string
      SubAccountType:
        title: Sub Account Type
        description: A service-provider-assigned name to identify the type of sub account .
        required: false
        range: string
      Tags:
        title: Tags
        description: The set of tags assigned to tag sources that account for potential provider-defined or user-defined tag evaluations.
        required: false
        range: string
enums:
  CapacityReservationStatusEnum:
    permissible_values:
      used:
        description: Charges that utilized a specific amount of a capacity reservation .
      unused:
        description: Charges that represent the unused portion of a capacity reservation .
  CommitmentDiscountCategoryEnum:
    permissible_values:
      spend:
        description: Commitment discounts that require a predetermined amount of spend.
      usage:
        description: Commitment discounts that require a predetermined amount of usage.
  CommitmentDiscountStatusEnum:
    permissible_values:
      used:
        description: Charges that utilized a specific amount of a commitment discount.
      unused:
        description: Charges that represent the unused portion of the commitment discount.
  ServiceCategoryEnum:
    permissible_values:
      ai_and_machine_learning:
        description: Artificial Intelligence and Machine Learning related technologies.
      analytics:
        description: Data processing, analytics, and visualization capabilities.
      business_applications:
        description: Business and productivity applications and services.
      compute:
        description: Virtual, containerized, serverless, or high-performance computing infrastructure and services.
      databases:
        description: Database platforms and services that allow for storage and querying of data.
      developer_tools:
        description: Software development and delivery tools and services.
      multicloud:
        description: Support for interworking of multiple cloud and/or on-premises environments.
      identity:
        description: Identity and access management services.
      integration:
        description: Services that allow applications to interact with one another.
      internet_of_things:
        description: Development and management of IoT devices and networks.
      management_and_governance:
        description: Management, logging, and observability of a customer's use of cloud.
      media:
        description: Media and entertainment streaming and processing services.
      migration:
